prompt = "Every 30 minutes, check the connected Gmail account for new shipment-related emails received after 2026-07-29 11:52:33 America/Los_Angeles from Siliconii senders (including @siliconii.net senders and messages visibly sent via/for Siliconii) and related customs brokers/freight forwarders such as KCC. Treat explicit shipment-release language such as Korean \"출고\" or English \"shipped\"/\"dispatched\" as a trigger to create or complete the shipment record, but map that event to the IMPORTS status Scheduled. Do not map an 출고/shipped email to the status Shipped. Continue using the surrounding email and documents to determine carrier and mode. Process only messages that have not already been handled; use invoice numbers, PI/shipment references, tracking numbers, airway/bill-of-lading numbers, filing numbers, entry numbers, existing Drive folders/files, and existing IMPORTS rows as idempotency checks.\n\nRecognize Siliconii AIR dispatch emails such as subjects matching \"미주법인 항공 출고서류 전달의 건_*\" (including messages from chaeyeon@siliconii.net and equivalent Siliconii logistics senders) as a canonical AIR-shipment pattern. Such an email may contain multiple named ZIPs, a consolidated packing list, and multiple schedule blocks/HAWBs. Treat each explicit HAWB/schedule block as a separate AIR shipment, separate Drive folder, and separate IMPORTS row. Associate each ZIP or document set to the correct HAWB using the email's pallet count, invoice numbers, packing-list remarks, ETD/ETA, and attachment names; never rely on attachment order alone. Preserve Korean filenames correctly, including CP949-encoded archive names. Upload a consolidated document to every shipment folder it explicitly covers. Later broker, arrival-notice, MAWB, filing, entry, or schedule emails for the same HAWB must complete the existing folder and row rather than create a duplicate.\n\nRecognize broker emails such as \"AIR SHIPMENT\", \"CURRENT STATUS\", \"ENTRY SUMMARY\", and recurring shipment-list updates as follow-up evidence for an existing shipment. Read the complete email/thread and any attached status spreadsheet to verify the FILING#, MAWB/MBL, HAWB/HBL, customs status, FDA status, entry number, ETA, and pallet count. A pre-arrival message saying an entry summary will be sent after customs approval/FDA release is not itself an entry-summary release and is not evidence of an FDA hold.\n\nFor each qualifying email:\n1. Read the complete relevant email/thread and attachment metadata. Download every shipment attachment that is required for the shipment record. Extract ZIP/RAR/archive contents safely and preserve the original archive and every original filename.\n2. Analyze the email and all extracted documents (commercial invoice, packing list, bill of lading/air waybill, arrival notice, entry summary, entry documents, schedules, status spreadsheets, and related PDFs). Classify the shipment as AIR or OCEAN from explicit evidence. Identify the carrier from explicit evidence. If classification or key identifiers are genuinely ambiguous, do not guess; report the message and missing information in this task.\n3. Use Google Drive folder IMPORT SHIPMENTS (ID 1AhGI2qM2pGFXSb406OY6dsOaN8unlGDM). For non-UPS AIR shipments, place the shipment-specific extracted folder inside AIR (ID 1zcS7f4VcziOCBETOMyxFZbj8S7JeISlr). For UPS AIR shipments, use the existing UPS AIR folder (ID 10xztoOaqhVoA6xVN_oz7y2x60PXikUvm) within IMPORT SHIPMENTS and create/reuse the shipment-specific folder there. For OCEAN shipments, place it directly inside IMPORT SHIPMENTS. Create a clearly named shipment folder using the best tracking/shipment/reference number, correct pallet count, and date. Before creating or uploading, search for a matching folder and files; reuse/complete or correct an existing partial folder and never create duplicates. Upload all extracted files and retain the original archive under its original filename.\n4. For every actual entry-summary email or attachment, download the entry-summary PDF(s), verify the entry number and shipment identifiers from the document, and upload the PDF to the existing IMPORT SHIPMENTS/ENTRY SUMMARIES folder (ID 1BcaMbPfCEPnb-Ig1rNq_pB7WWdauNE1J). Search that folder by entry number, HAWB/HBL, MAWB/MBL, and filename before uploading. Reuse the existing file when it is already present; never create a duplicate. Preserve the original filename unless an existing verified naming convention requires a clearer HAWB-entry-date filename.\n5. Update the existing Google Sheet LOGISTICS MASTER 2026 (spreadsheet ID 1M-vZ24Yw4ZN7R7b_473cVn8kny8DznTakSsD3VQsCzc), tab IMPORTS. Read live metadata, headers, all relevant physical rows, validation, formatting, formulas, merged ranges, conditional formatting, and section boundaries before writing. Resolve each shipment to the physical source row by scanning the complete bounded sheet and matching tracking number, shipment, invoice, PI reference, MBL/MAWB, HBL/HAWB, filing number, and entry number. Re-resolve immediately before writing and re-read the exact row after writing. Never use a compacted dashboard/GViz row index as a physical Sheets row. If a matching partial or misaligned row exists, correct/complete that row instead of appending. Write the verified customs entry number in the ENTRY NUMBER column (currently column K) on the matched row; do not write a filing number there.\n6. Inspect explicit FDA-status evidence in the email body, attached status table/spreadsheet, and entry documents. If the shipment is explicitly stated to be under FDA review, FDA hold, or pending FDA review, set the validated WEBSITE STATUS value to exactly \"FDA Review / Hold\". Do not infer a hold merely because an email says FDA release is still pending or will be reported later. If the evidence explicitly says FDA detained, use the separate validated value \"FDA Detained\". If a later message explicitly confirms FDA release, customs release, delivery, or receipt, replace an obsolete hold status only with the later supported validated status. The IMPORTS sheet has a conditional-format rule that highlights rows whose WEBSITE STATUS is \"FDA Review / Hold\" with a light-yellow fill; preserve that rule and verify the row color.\n7. For UPS shipments, write only in the existing UPS section that begins at row 291. Follow a nearby UPS exemplar and preserve its merged section label, formatting, validation, and hyperlinks. Populate the tracking number, invoice, department/destination, PI and shipment description, explicit ETA, and official UPS tracking hyperlink. Link the invoice cell to the Drive shipment folder, as the UPS section exemplars do. Put pallet/carton/piece/weight/CBM, invoice total, brand, and ship-to details in a cell note when useful. When the triggering email states 출고/shipped/dispatched and the status validation allows it, set WEBSITE STATUS to Scheduled. Never set Shipped solely because an email states 출고/shipped. Never create a second UPS row for the same tracking, invoice, or PI reference.\n8. For non-UPS shipments, append one new shipment row after the latest shipment entry and before the summary area only when no match exists, copying a safe nearby exemplar so formatting, validation, formulas, and hyperlinks are preserved. Link the DOCS cell to the correct Drive shipment folder. Fill every relevant field supported by the documents, including shipment name/HAWB, invoice, MBL/MAWB, filing/HBL field according to the live sheet convention, container when applicable, entry number, vessel/flight/carrier when explicit, ETD, ETA, delivery/LFD when explicit, and pallet/carton/piece/weight/CBM and invoice totals in Notes when useful. For an 출고/shipped/dispatched trigger, use status Scheduled; use any later status only when separate evidence explicitly supports that later stage and the validation allows it. Do not infer unsupported values.\n9. Re-read and visually verify the ENTRY SUMMARIES folder, each shipment folder, and every written IMPORTS row. Confirm entry-number accuracy, folder/file idempotency, MAWB/HAWB mapping, status validation, light-yellow FDA Review / Hold highlighting, and physical row alignment. Confirm there are no duplicates and preserve all unrelated sheet content.\n10. Post a concise result in this task for each processed email with the sender/subject, carrier, AIR or OCEAN classification, key shipment and entry details, FDA status, Entry Summaries folder/file link, and exact IMPORTS row/range. If no new actual entry summary or explicit FDA-status change qualifies, report that without making unsupported changes."
